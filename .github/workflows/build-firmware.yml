name: Build Watch Firmware

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-twatch2021
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Fix git safe.directory
        run: git config --global --add safe.directory '*'

      - name: Build t-watch2021-v1
        run: pio run -e t-watch2021-v1

      - name: Build t-watch2021-v2
        run: pio run -e t-watch2021-v2
        continue-on-error: true

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: watch-firmware
          path: |
            .pio/build/t-watch2021-v1/firmware.bin
            .pio/build/t-watch2021-v2/firmware.bin
          if-no-files-found: warn
